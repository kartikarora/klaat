kotlin.code.style=official

# Enable Gradle toolchain auto-provisioning and auto-download
# Gradle will automatically download GraalVM 21 if not found locally
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Note: For local development, if tests fail with "native-image wasn't found",
# you may need to create a local gradle.properties (not committed) with:
# org.gradle.java.home=/path/to/graalvm
# Get the path with: sdk home java 21.0.2-graalce
