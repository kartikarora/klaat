version: 2.1

# Define parameters for manual triggering
parameters:
  run_snapshot:
    type: boolean
    default: false
  build_num:
    type: string
    default: ""

# Reusable commands for GraalVM and build logic
commands:
  setup_graalvm:
    parameters:
      arch:
        type: string
        default: ""
    steps:
      - run:
          name: Install GraalVM
          command: |
            # On macOS, ensure we use a modern Bash (installed via Homebrew by default in CI)
            if [ "$(uname)" = "Darwin" ]; then
                # Check current bash version
                CURRENT_BASH_MAJOR=$(bash -c 'echo "${BASH_VERSINFO[0]}"')
                if [ "$CURRENT_BASH_MAJOR" -lt 4 ]; then
                    echo "Bash version is too old ($CURRENT_BASH_MAJOR). Installing modern Bash via Homebrew..."
                    brew install bash
                fi

                if [ -f /usr/local/bin/bash ]; then
                    SHELL_CMD="/usr/local/bin/bash"
                elif [ -f /opt/homebrew/bin/bash ]; then
                    SHELL_CMD="/opt/homebrew/bin/bash"
                else
                    SHELL_CMD="bash"
                fi
            else
                SHELL_CMD="bash"
            fi

            # Install SDKMAN
            if ! command -v sdk >/dev/null 2>&1; then
              curl -s "https://get.sdkman.io" | $SHELL_CMD
            fi
            
            # Source SDKMAN
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            
            # Use the modern bash to run sdk install if on Mac
            if [ "$(uname)" = "Darwin" ]; then
               alias sdk="$SHELL_CMD -c 'source $HOME/.sdkman/bin/sdkman-init.sh && sdk \"\$@\"' --"
            fi
            
            # Install GraalVM
            JAVA_VERSION="25.0.2-graalce"
            
            # On macOS, if we need x86_64 but we are on ARM64, we need to tell SDKMAN
            # to show us all versions so we can pick the x86_64 one.
            # However, simpler is to just use arch -x86_64 for the install command too if needed.
            if [ -n "<< parameters.arch >>" ] && [ "$(uname)" = "Darwin" ]; then
                if [ "<< parameters.arch >>" = "x86_64" ] && [ "$(uname -m)" = "arm64" ]; then
                    echo "Force installing x86_64 JDK on ARM64 Mac..."
                    arch -x86_64 bash -c "source $HOME/.sdkman/bin/sdkman-init.sh && sdk install java $JAVA_VERSION || true && sdk use java $JAVA_VERSION"
                else
                    sdk install java $JAVA_VERSION || true
                    sdk use java $JAVA_VERSION
                fi
            else
                sdk install java $JAVA_VERSION || true
                sdk use java $JAVA_VERSION
            fi
            
            # Export to BASH_ENV for subsequent steps
            {
              echo "export JAVA_HOME=$JAVA_HOME"
              echo "export PATH=$JAVA_HOME/bin:$PATH"
            } >> $BASH_ENV

  get_version:
    parameters:
      build_num:
        type: string
        default: ""
    steps:
      - run:
          name: Get Version
          command: |
            BASE_VERSION=$(grep "^klaat = " gradle/libs.versions.toml | sed 's/klaat = "\(.*\)"/\1/')
            SHORT_HASH=$(git rev-parse --short=8 HEAD)
            BUILD_NUM="<< parameters.build_num >>"
            if [ -z "$BUILD_NUM" ]; then
              BUILD_NUM="${CIRCLE_BUILD_NUM}"
            fi
            VERSION="${BASE_VERSION}.${BUILD_NUM}-${SHORT_HASH}"
            echo "export VERSION=${VERSION}" >> $BASH_ENV
            echo "Version is ${VERSION}"

  prepare_credentials:
    steps:
      - run:
          name: Prepare Google API Credentials
          command: |
            mkdir -p src/main/resources/credentials
            echo "${GOOGLE_CREDENTIALS_JSON}" > src/main/resources/credentials/gcp_credentials.json

  build_native:
    parameters:
      platform:
        type: string
    steps:
      - prepare_credentials
      - run:
          name: Build Native Binary for << parameters.platform >>
          command: |
            export IS_SNAPSHOT="true"
            export VERSION_NAME="${VERSION}"
            ./gradlew nativeCompile
            
            BINARY_BASE="klaat-snapshot"
            BINARY_NAME="${BINARY_BASE}-<< parameters.platform >>-${VERSION}"
            cp build/native/nativeCompile/${BINARY_BASE} ${BINARY_NAME}
            
            # Calculate checksum (sha256sum on Linux, shasum -a 256 on macOS)
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum ${BINARY_NAME} > checksums-<< parameters.platform >>-${VERSION}.txt
            else
              shasum -a 256 ${BINARY_NAME} > checksums-<< parameters.platform >>-${VERSION}.txt
            fi
            cat checksums-<< parameters.platform >>-${VERSION}.txt

  upload_to_r2:
    steps:
      - run:
          name: Install and configure rclone
          command: |
            if ! command -v rclone >/dev/null 2>&1; then
              curl https://rclone.org/install.sh | sudo bash
            fi
            mkdir -p ~/.config/rclone
            cat \<< EOF > ~/.config/rclone/rclone.conf
            [r2]
            type = s3
            provider = Cloudflare
            access_key_id = ${R2_ACCESS_KEY_ID}
            secret_access_key = ${R2_SECRET_ACCESS_KEY}
            endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
            acl = private
            EOF
      - run:
          name: Upload binaries and checksums
          command: |
            DESTINATION_PATH="bin/klaat/snapshot/${VERSION}/"
            echo "🚀 Uploading binaries to R2: ${DESTINATION_PATH}"
            
            # Upload each binary and checksum file found in the workspace
            for file in klaat-snapshot-*; do
              if [ -f "$file" ]; then
                echo "📦 Uploading $file..."
                rclone copy "$file" r2:${R2_BUCKET_NAME}/${DESTINATION_PATH}
              fi
            done
            
            # Consolidate and upload checksums
            cat checksums-*.txt > consolidated-checksums-${VERSION}.txt
            rclone copy consolidated-checksums-${VERSION}.txt r2:${R2_BUCKET_NAME}/${DESTINATION_PATH}

jobs:
  build_linux_x64:
    parameters:
      build_num:
        type: string
        default: ""
    docker:
      - image: cimg/base:current
    resource_class: large
    steps:
      - checkout
      - setup_graalvm
      - get_version:
          build_num: << parameters.build_num >>
      - build_native:
          platform: linux-x64
      - persist_to_workspace:
          root: .
          paths:
            - klaat-snapshot-linux-x64-*
            - checksums-*.txt

  build_linux_arm64:
    parameters:
      build_num:
        type: string
        default: ""
    docker:
      - image: cimg/base:current
    resource_class: arm.large
    steps:
      - checkout
      - setup_graalvm
      - get_version:
          build_num: << parameters.build_num >>
      - build_native:
          platform: linux-arm64
      - persist_to_workspace:
          root: .
          paths:
            - klaat-snapshot-linux-arm64-*
            - checksums-*.txt

  build_macos_arm64:
    parameters:
      build_num:
        type: string
        default: ""
    macos:
      xcode: "15.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - setup_graalvm:
          arch: "arm64"
      - get_version:
          build_num: << parameters.build_num >>
      - build_native:
          platform: macos-arm64
      - persist_to_workspace:
          root: .
          paths:
            - klaat-snapshot-macos-arm64-*
            - checksums-*.txt

  run_tests:
    docker:
      - image: cimg/base:current
    resource_class: large
    steps:
      - checkout
      - setup_graalvm
      - run:
          name: Run Tests
          command: ./gradlew test

  publish_snapshot:
    parameters:
      build_num:
        type: string
        default: ""
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - get_version:
          build_num: << parameters.build_num >>
      - upload_to_r2

  update_snapshot_tap:
    parameters:
      build_num:
        type: string
        default: ""
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - get_version:
          build_num: << parameters.build_num >>
      - run:
          name: Update Homebrew Snapshot Tap
          command: |
            # Check for required environment variables
            if [ -z "${TAP_GITHUB_TOKEN}" ]; then
              echo "❌ Error: TAP_GITHUB_TOKEN is not set."
              exit 1
            fi

            # Configure git
            git config --global user.name "circleci-bot"
            git config --global user.email "circleci-bot@users.noreply.github.com"
            
            # Extract checksums
            MACOS_ARM64_SHA=$(grep "klaat-snapshot-macos-arm64-${VERSION}" checksums-macos-arm64-${VERSION}.txt | awk '{print $1}' | head -n 1)
            LINUX_ARM64_SHA=$(grep "klaat-snapshot-linux-arm64-${VERSION}" checksums-linux-arm64-${VERSION}.txt | awk '{print $1}' | head -n 1)
            LINUX_X64_SHA=$(grep "klaat-snapshot-linux-x64-${VERSION}" checksums-linux-x64-${VERSION}.txt | awk '{print $1}' | head -n 1)
            
            # Verify we got all checksums
            if [ -z "$MACOS_ARM64_SHA" ] || [ -z "$LINUX_ARM64_SHA" ] || [ -z "$LINUX_X64_SHA" ]; then
              echo "❌ Error: Could not find all platform checksums."
              echo "MACOS_ARM64_SHA: $MACOS_ARM64_SHA"
              echo "LINUX_ARM64_SHA: $LINUX_ARM64_SHA"
              echo "LINUX_X64_SHA: $LINUX_X64_SHA"
              exit 1
            fi
            
            # Clone tap repository
            git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/kartikarora/homebrew-tap.git" tap
            cd tap
            
            # Create Formula directory if it doesn't exist
            mkdir -p Formula
            
            # Normalize CDN URL (remove trailing slash)
            CDN_URL=$(echo "${CDN_URL}" | sed 's:/*$::')
            
            # Copy template and replace placeholders
            cp ../.github/formulas/klaat-snapshot.rb.template Formula/klaat-snapshot.rb
            sed -i "s|COMMIT_HASH_PLACEHOLDER|${VERSION}|g" Formula/klaat-snapshot.rb
            sed -i "s|CDN_URL_PLACEHOLDER|${CDN_URL}|g" Formula/klaat-snapshot.rb
            sed -i "s|MACOS_ARM64_SHA_PLACEHOLDER|${MACOS_ARM64_SHA}|g" Formula/klaat-snapshot.rb
            sed -i "s|LINUX_ARM64_SHA_PLACEHOLDER|${LINUX_ARM64_SHA}|g" Formula/klaat-snapshot.rb
            sed -i "s|LINUX_X64_SHA_PLACEHOLDER|${LINUX_X64_SHA}|g" Formula/klaat-snapshot.rb
            
            # Commit and push using the token-authenticated URL
            git add Formula/klaat-snapshot.rb
            git commit -m "klaat-snapshot ${VERSION} (via CircleCI)"
            git push "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/kartikarora/homebrew-tap.git" main

  create_github_snapshot_release:
    parameters:
      build_num:
        type: string
        default: ""
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - get_version:
          build_num: << parameters.build_num >>
      - run:
          name: Install GitHub CLI
          command: |
            if ! command -v gh >/dev/null 2>&1; then
              (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
              && sudo mkdir -p -m 755 /etc/apt/keyrings \
              && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
              && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
              && sudo apt update \
              && sudo apt install gh -y
            fi
      - run:
          name: Create GitHub Snapshot Release
          command: |
            if [ -z "${TAP_GITHUB_TOKEN}" ]; then
              echo "❌ Error: TAP_GITHUB_TOKEN is not set."
              exit 1
            fi
            
            # Configure git
            git config --global user.name "circleci-bot"
            git config --global user.email "circleci-bot@users.noreply.github.com"
            
            # Create and push tag
            git tag -a "${VERSION}" -m "Snapshot ${VERSION} (via CircleCI)"
            git push "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/kartikarora/klaat.git" "${VERSION}"
            
            # Normalize CDN URL
            CDN_URL=$(echo "${CDN_URL}" | sed 's:/*$::')
            
            # Create release notes
            cat > release-notes.md << EOF
            # Klaat Snapshot ${VERSION}
            
            **⚠️ This is a pre-release snapshot build from the develop branch.**
            
            ## Installation
            
            ### Homebrew (macOS & Linux)
            \`\`\`bash
            brew install kartikarora/tap/klaat-snapshot
            \`\`\`
            
            ### Manual Download
            Download the native binary for your platform (no Java required):
            
            - [macOS ARM64](${CDN_URL}/bin/klaat/snapshot/${VERSION}/klaat-snapshot-macos-arm64-${VERSION})
            - [Linux ARM64](${CDN_URL}/bin/klaat/snapshot/${VERSION}/klaat-snapshot-linux-arm64-${VERSION})
            - [Linux x64](${CDN_URL}/bin/klaat/snapshot/${VERSION}/klaat-snapshot-linux-x64-${VERSION})
            
            ### Checksums
            [consolidated-checksums-${VERSION}.txt](${CDN_URL}/bin/klaat/snapshot/${VERSION}/consolidated-checksums-${VERSION}.txt)
            
            ---
            
            **Note**: All binaries are native executables built with GraalVM. No JRE installation required!
            EOF
            
            # Create GitHub Release
            GH_TOKEN=${TAP_GITHUB_TOKEN} gh release create "${VERSION}" \
              --title "Snapshot ${VERSION}" \
              --notes-file release-notes.md \
              --prerelease

workflows:
  version: 2
  snapshot_release:
    when: << pipeline.parameters.run_snapshot >>
    jobs:
      - build_linux_x64:
          build_num: << pipeline.parameters.build_num >>
      - build_linux_arm64:
          build_num: << pipeline.parameters.build_num >>
      - build_macos_arm64:
          build_num: << pipeline.parameters.build_num >>
      - run_tests
      - publish_snapshot:
          build_num: << pipeline.parameters.build_num >>
          requires:
            - build_linux_x64
            - build_linux_arm64
            - build_macos_arm64
            - run_tests
      - update_snapshot_tap:
          build_num: << pipeline.parameters.build_num >>
          requires:
            - publish_snapshot
      - create_github_snapshot_release:
          build_num: << pipeline.parameters.build_num >>
          requires:
            - update_snapshot_tap
