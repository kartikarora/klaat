<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#4F7DC9">
  <meta charset="UTF-8">
  <title>${title?html}</title>
  <#if googleFonts?has_content>
  <link rel="stylesheet" href="${googleFonts}">
  <#else>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap">
  </#if>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <#if favicon?has_content>
  <link rel="icon" href="${favicon}">
  </#if>
  <link rel="stylesheet" href="${cssPrefix}/codelab-elements.css">
  <link rel="stylesheet" href="${cssPrefix}/klaat-custom.css">
  <#if customCssUrl?has_content>
  <link rel="stylesheet" href="${customCssUrl}">
  <script src="${jsPrefix}/klaat-bridge.js?timestamp=${timestamp}"></script>
  </#if>
  <style>
    .code-container {
      position: relative;
    }
    .copy-button {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #333;
    }
    .copy-button .material-icons {
      font-size: 16px;
    }
    .code-container:hover .copy-button {
      opacity: 1;
    }
    .copy-button:hover {
      background: #fff;
    }
    code, pre, .prettyprint, code[class*="lang-"], pre[class*="lang-"],
    google-codelab-step code, google-codelab-step pre,
    .step__body code, .step__body pre {
      font-family: 'JetBrains Mono', monospace !important;
    }
    google-codelab:not([theme="minimal"]) google-codelab-step .instructions aside.special,
    google-codelab google-codelab-step aside.special,
    aside.special {
      border-color: #1A73E8 !important;
      background: #E8F0FE !important;
      color: #212124 !important;
    }
    google-codelab:not([theme="minimal"]) google-codelab-step .instructions aside.critical,
    google-codelab google-codelab-step aside.critical,
    aside.critical {
      border-color: #D93025 !important;
      background: #FCE8E6 !important;
      color: #212124 !important;
    }
    google-codelab:not([theme="minimal"]) google-codelab-step .instructions aside.positive,
    google-codelab google-codelab-step aside.positive,
    aside.positive {
      border-color: #1E8E3E !important;
      background: #E6F4EA !important;
      color: #212124 !important;
    }
    google-codelab:not([theme="minimal"]) google-codelab-step .instructions aside.default,
    google-codelab google-codelab-step aside.default,
    aside.default {
      border-left: 4px solid #808080 !important;
      background: #F1F3F4 !important;
      padding: 0.5em 1em !important;
      margin: 2em 0 !important;
      border-radius: 4px !important;
      color: #212124 !important;
    }
  </style>
</head>
<body>
  <script>
    function copyToClipboard(button) {
      const container = button.parentElement;
      const code = container.querySelector('code').innerText;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          updateButtonText(button);
        }).catch(err => {
          console.error('Failed to copy: ', err);
          fallbackCopy(code, button);
        });
      } else {
        fallbackCopy(code, button);
      }
    }

    function fallbackCopy(text, button) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      textArea.style.top = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        updateButtonText(button);
      } catch (err) {
        console.error('Fallback copy failed: ', err);
      }
      document.body.removeChild(textArea);
    }

    function updateButtonText(button) {
      const textSpan = button.querySelector('span:last-child');
      const originalText = textSpan.textContent;
      textSpan.textContent = 'Copied!';
      setTimeout(() => {
        textSpan.textContent = originalText;
      }, 2000);
    }
  </script>
  <google-codelab-analytics gaid="${globalGA}"></google-codelab-analytics>
  <google-codelab codelab-gaid="${codelabGA}"
                  id="${id?html}"
                  title="${title?html}"
                  environment="${environment}"
                  feedback-link="${feedbackLink}">
<#list steps as step>
    <google-codelab-step label="${step.title?html}"<#if step.hasDuration> duration="${step.duration}"</#if>>
      ${step.content}
    </google-codelab-step>
</#list>
  </google-codelab>

  <script src="${jsPrefix}/native-shim.js"></script>
  <script src="${jsPrefix}/custom-elements.min.js"></script>
  <script src="${jsPrefix}/prettify.js"></script>
  <script src="${jsPrefix}/codelab-elements.js"></script>
  <script src="//support.google.com/inapp/api.js"></script>

</body>
</html>
