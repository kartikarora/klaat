name: Cleanup All Artifacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only list artifacts, do not delete)'
        required: true
        default: 'true'
        type: boolean

# This workflow requires a Personal Access Token (PAT) named CLEANUP_GH_TOKEN with the correct scopes.
# For a Classic PAT: Select 'repo' and 'workflow' (or 'actions' if available) scopes.
# For a Fine-grained PAT: 
#   1. Select 'All repositories' or 'Only select repositories' (select the target ones).
#   2. Under 'Repository permissions', select 'Actions' (Read and write).

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup artifacts
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.CLEANUP_GH_TOKEN }}
        with:
          github-token: ${{ secrets.CLEANUP_GH_TOKEN }}
          script: |
            const dryRun = ${{ github.event.inputs.dry_run == 'true' }};
            console.log(`Dry run: ${dryRun}`);

            if (!process.env.GITHUB_TOKEN) {
              core.setFailed("CLEANUP_GH_TOKEN secret is missing. Please add a Personal Access Token with 'repo' and 'workflow' (or 'actions') scopes as CLEANUP_GH_TOKEN secret.");
              return;
            }

            try {
              // 1. Get all repositories for the authenticated user
              const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
                visibility: 'all',
                affiliation: 'owner'
              });

              console.log(`Found ${repos.length} repositories.`);

              for (const repo of repos) {
                const owner = repo.owner.login;
                const repoName = repo.name;
                
                if (owner !== 'kartikarora') {
                  console.log(`Skipping ${owner}/${repoName} as owner is not kartikarora.`);
                  continue;
                }
                
                console.log(`Checking artifacts for ${owner}/${repoName}...`);

                // 2. List artifacts for each repository
                const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                  owner: owner,
                  repo: repoName
                });

                if (artifacts.length === 0) {
                  console.log(`  No artifacts found in ${repoName}.`);
                  continue;
                }

                console.log(`  Found ${artifacts.length} artifacts in ${repoName}.`);

                for (const artifact of artifacts) {
                  const deleteUrl = `https://api.github.com/repos/${owner}/${repoName}/actions/artifacts/${artifact.id}`;
                  console.log(`    Artifact: ${artifact.name} (ID: ${artifact.id}, Size: ${artifact.size_in_bytes} bytes, Created: ${artifact.created_at})`);
                  console.log(`    Delete API URL: ${deleteUrl}`);
                  
                  if (!dryRun) {
                    try {
                      await github.rest.actions.deleteArtifact({
                        owner: owner,
                        repo: repoName,
                        artifact_id: artifact.id
                      });
                      console.log(`    Successfully deleted artifact ${artifact.id}.`);
                    } catch (error) {
                      console.error(`    Failed to delete artifact ${artifact.id}: ${error.message}`);
                    }
                  } else {
                    console.log(`    [DRY RUN] Would delete artifact ${artifact.id}.`);
                  }
                }
              }
            } catch (error) {
              core.setFailed(`Workflow failed: ${error.message}`);
            }
