name: Upload CDN Assets

on:
  push:
    branches:
      - develop
    paths:
      - 'src/main/resources/assets/**'
      - 'scripts/upload-cdn.sh'
      - '.github/workflows/upload-cdn-assets.yml'
  workflow_dispatch:

concurrency:
  group: cdn-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minify-and-upload:
    name: Minify & Upload Assets to R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Minification Tools
        run: |
          npm install -g clean-css-cli terser

      - name: Upload Assets to Cloudflare R2 via Wrangler Action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            chmod +x scripts/upload-cdn.sh
            ./scripts/upload-cdn.sh --minify --purge
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'distribute-cdn' }}
          CDN_URL: ${{ secrets.CDN_URL || 'https://distribute.kartikarora.me' }}
