name: Native Stable Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            name: Linux x64
          - os: ubuntu-latest
            platform: linux-arm64
            name: Linux ARM64
          - os: macos-latest
            platform: macos-x64
            name: macOS x64
          - os: macos-latest
            platform: macos-arm64
            name: macOS ARM64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup GraalVM
        uses: ./.github/actions/setup-graalvm

      - name: Get version
        id: version
        uses: ./.github/actions/get-version
        with:
          type: release

      - name: Build native binary
        uses: ./.github/actions/build-native
        with:
          version: ${{ steps.version.outputs.version }}
          platform: ${{ matrix.platform }}
          google-credentials-json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: klaat-${{ matrix.platform }}-${{ steps.version.outputs.version }}
          path: |
            klaat-${{ matrix.platform }}-${{ steps.version.outputs.version }}
            checksums-${{ steps.version.outputs.version }}.txt

  upload-and-publish:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/get-version
        with:
          type: release

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Consolidate checksums
        id: checksums
        uses: ./.github/actions/consolidate-checksums
        with:
          artifacts-path: artifacts
          output-file: checksums-${{ steps.version.outputs.version }}.txt

      - name: Normalize CDN URL
        id: cdn
        uses: ./.github/actions/normalize-cdn-url
        with:
          cdn-url: ${{ secrets.CDN_URL }}

      - name: Upload all binaries to R2
        uses: ./.github/actions/upload-all-binaries-to-r2
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket-name: ${{ secrets.R2_BUCKET_NAME }}
          artifacts-path: artifacts
          destination-path: bin/klaat/release/${{ steps.version.outputs.version }}/
          checksum-file: ${{ steps.checksums.outputs.checksum-file }}
          version-pattern: ${{ steps.version.outputs.version }}

      - name: Submit to Homebrew Core
        uses: ./.github/actions/submit-to-homebrew-core
        with:
          version: ${{ steps.version.outputs.version }}
          cdn-url: ${{ steps.cdn.outputs.url }}
          checksums-file: ${{ steps.checksums.outputs.checksum-file }}
          github-token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: ./.github/actions/create-github-release
        with:
          version: ${{ steps.version.outputs.version }}
          cdn-url: ${{ steps.cdn.outputs.url }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
