name: Native Stable Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: ./.github/actions/setup-graalvm

      - name: Run tests
        run: ./gradlew test

      - name: Cancel builds on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            for (const job of jobs.data.jobs) {
              if (job.name.startsWith('Build ') && job.status === 'in_progress') {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });
                break;
              }
            }

  build-native:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            name: Linux x64
          - os: ubuntu-latest
            platform: linux-arm64
            name: Linux ARM64
          - os: macos-latest
            platform: macos-arm64
            name: macOS ARM64

    runs-on: ${{ matrix.os }}
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: ./.github/actions/setup-graalvm

      - name: Get version
        id: version
        uses: ./.github/actions/get-version
        with:
          type: release

      - name: Build native binary
        id: build
        uses: ./.github/actions/build-native
        with:
          version: ${{ steps.version.outputs.version }}
          platform: ${{ matrix.platform }}
          google-credentials-json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.binary-name }}
          path: |
            ${{ steps.build.outputs.binary-name }}*
            checksums-${{ steps.version.outputs.version }}.txt
          retention-days: 1

  upload-and-publish:
    needs: [build-native, run-tests]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.run-tests.result == 'success' && needs.build-native.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: ./.github/actions/get-version
        with:
          type: release

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Consolidate checksums
        id: checksums
        uses: ./.github/actions/consolidate-checksums
        with:
          artifacts-path: artifacts
          output-file: checksums-${{ steps.version.outputs.version }}.txt

      - name: Normalize CDN URL
        id: cdn
        uses: ./.github/actions/normalize-cdn-url
        with:
          cdn-url: ${{ secrets.CDN_URL }}

      - name: Upload all binaries to R2
        uses: ./.github/actions/upload-all-binaries-to-r2
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket-name: ${{ secrets.R2_BUCKET_NAME }}
          artifacts-path: artifacts
          destination-path: bin/klaat/release/${{ steps.version.outputs.version }}/
          checksum-file: ${{ steps.checksums.outputs.checksum-file }}
          version-pattern: ${{ steps.version.outputs.version }}

      - name: Upload CDN Assets to R2
        uses: ./.github/actions/upload-cdn-assets
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-bucket-name: ${{ secrets.R2_BUCKET_NAME || 'distribute-cdn' }}
          cloudflare-zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cdn-url: ${{ steps.cdn.outputs.url }}

      - name: Update Homebrew stable tap
        uses: ./.github/actions/update-stable-tap
        with:
          version: ${{ steps.version.outputs.version }}
          cdn-url: ${{ steps.cdn.outputs.url }}
          checksums-file: ${{ steps.checksums.outputs.checksum-file }}
          github-token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: ./.github/actions/create-github-release
        with:
          version: ${{ steps.version.outputs.version }}
          cdn-url: ${{ steps.cdn.outputs.url }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  eval-skills:
    name: Evaluate Bundled Skills
    needs: [upload-and-publish]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ !cancelled() && needs.upload-and-publish.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GraalVM
        uses: ./.github/actions/setup-graalvm

      - name: Run live skills evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
          GEMINI_MODEL_THINKING_LEVEL: low
          GEMINI_JUDGE_MODEL: gemini-4-neon
          GEMINI_JUDGE_THINKING_LEVEL: low
          ENABLE_LLM_JUDGE: "true"
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not set; skipping live skills evaluation."
            exit 0
          fi
          ./gradlew evalSkills -PupdateDocs=true

      - name: Publish evaluation summary
        if: always()
        run: |
          if [ -f build/reports/evals/eval-summary.md ]; then
            cat build/reports/evals/eval-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated eval report
        run: |
          if ! git diff --quiet -- docs/docs/eval-report.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/docs/eval-report.json
            git commit -m "chore(evals): update skills benchmark report [skip ci]"
            git push
          fi
