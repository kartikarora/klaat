name: 'Build Native Binary'
description: 'Builds Klaat native binary using GraalVM'

inputs:
  version:
    description: 'Version string for the binary'
    required: true
  platform:
    description: 'Target platform (linux-x64, linux-arm64, macos-x64, macos-arm64)'
    required: true
  google-credentials-json:
    description: 'Google OAuth credentials JSON'
    required: true

outputs:
  binary-name:
    description: 'Name of the created binary'
    value: ${{ steps.build.outputs.binary-name }}

runs:
  using: 'composite'
  steps:
    - name: Create gcp_credentials.json
      shell: bash
      run: |
        mkdir -p src/main/resources/credentials
        echo '${{ inputs.google-credentials-json }}' > src/main/resources/credentials/gcp_credentials.json

    - name: Build native image
      id: build
      shell: bash
      run: |
        ./gradlew nativeCompile

        # Move and rename binary based on platform
        BINARY_NAME="klaat-${{ inputs.platform }}-${{ inputs.version }}"
        cp build/native/nativeCompile/klaat ${BINARY_NAME}

        echo "binary-name=${BINARY_NAME}" >> $GITHUB_OUTPUT

    - name: Calculate SHA256 checksum
      shell: bash
      run: |
        sha256sum klaat-* > checksums-${{ inputs.version }}.txt
        cat checksums-${{ inputs.version }}.txt
