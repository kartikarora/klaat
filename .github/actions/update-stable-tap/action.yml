name: 'Update Stable Tap'
description: 'Updates the kartikarora/homebrew-tap tap with the latest stable version'

inputs:
  version:
    description: 'Version string (e.g. 1.0.0)'
    required: true
  cdn-url:
    description: 'CDN base URL'
    required: true
  checksums-file:
    description: 'Path to checksums file'
    required: true
  github-token:
    description: 'GitHub token for pushing to tap repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Clone tap repository
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        git clone https://x-access-token:${GITHUB_TOKEN}@github.com/kartikarora/homebrew-tap.git tap

    - name: Update formula
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CDN_URL: ${{ inputs.cdn-url }}
        CHECKSUMS_FILE: ${{ inputs.checksums-file }}
      run: |
        cd tap

        # Get checksums for each platform
        MACOS_ARM64_SHA=$(grep "klaat-macos-arm64-${VERSION}" ../${CHECKSUMS_FILE} | awk '{print $1}')
        LINUX_ARM64_SHA=$(grep "klaat-linux-arm64-${VERSION}" ../${CHECKSUMS_FILE} | awk '{print $1}')
        LINUX_X64_SHA=$(grep "klaat-linux-x64-${VERSION}" ../${CHECKSUMS_FILE} | awk '{print $1}')

        # Create Formula directory if it doesn't exist
        mkdir -p Formula

        # Copy template and replace placeholders
        cp ../.github/formulas/klaat.rb.template Formula/klaat.rb
        sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" Formula/klaat.rb
        sed -i "s|CDN_URL_PLACEHOLDER|${CDN_URL}|g" Formula/klaat.rb
        sed -i "s|MACOS_ARM64_SHA_PLACEHOLDER|${MACOS_ARM64_SHA}|g" Formula/klaat.rb
        sed -i "s|LINUX_ARM64_SHA_PLACEHOLDER|${LINUX_ARM64_SHA}|g" Formula/klaat.rb
        sed -i "s|LINUX_X64_SHA_PLACEHOLDER|${LINUX_X64_SHA}|g" Formula/klaat.rb

    - name: Commit and push
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        cd tap
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/klaat.rb
        git commit -m "klaat ${VERSION}"
        git push

    - name: Output tap info
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        echo "✅ Updated kartikarora/homebrew-tap tap to ${VERSION}"
        echo ""
        echo "Users can install with:"
        echo "  brew install kartikarora/tap/klaat"
