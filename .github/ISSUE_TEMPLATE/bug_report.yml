name: Bug Report
description: Report a bug or unexpected behavior in Klaat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, input Markdown/Doc structure, or flags used.
      placeholder: |
        1. Run `klaat export ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Klaat version & OS
      description: Output of `klaat version` and your OS/architecture (e.g. macOS ARM64, Linux x64).
    validations:
      required: true
